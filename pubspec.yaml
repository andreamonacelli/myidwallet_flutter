name: myidwallet_flutter
description: My ID Wallet app. Originally developed as a university project, the software is now expanding to a broader community

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  path: ^1.9.0
  sqflite: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/