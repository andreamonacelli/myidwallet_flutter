name: myidwallet_flutter
description: My ID Wallet app. Originally developed as a university project, the software is now expanding to a broader community

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.1.1

dependencies:
  flutter:
    sdk: flutter

  english_words: ^4.0.0
  provider: ^6.0.0
  camera: ^0.11.0+2
  path_provider: ^2.1.2
  path: ^1.9.0
  sqflite: ^2.3.3
  image_picker: ^1.0.4
  uuid: ^4.4.0
  barcode_widget: 2.0.4
  google_mlkit_text_recognition: ^0.13.0
  intl: ^0.19.0
  fuzzywuzzy: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.3.0
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700

# Configuring app's launcher icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/application_icon.png"
  min_sdk_android: 21

# Configuring app's splash screen
flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/application_icon.png"
  android: true
  android_gravity: center
  ios: true
  ios_content_mode: center
  fullscreen: true